<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Login: VALENTIM</title>
</head>
<body>
    <header>
        <h1>VALENTIM</h1>
        <h2>Visão Analítica de Lançamentos e Estratégias para Negócios, Transações, Investimentos e Monitoramento</h2>
    </header>
    <main>
        <div class="container">
            <div id="divLogin">
            <h2 id="login">Login</h2>
                <form id="formLogin">
                    <label for="inputNome">Nome:</label>
                    <br>
                    <input type="text" placeholder="Insira seu nome" id="inputNome">
                    <br>
                    <label for="inputSenha">Senha:</label>
                    <br>
                    <input type="password" placeholder="Insira sua senha" id="inputSenha">
                    <br>
                    <button type="submit" id="botaoEnvio">Login</button>
                </form>
            </div>
        </div>
    </main>
    <footer>
        <a href="https://github.com/Matheus-Lacerda009/ERP-Financeiro.git">GitHub</a>
    </footer>
</body>
<script src="index.js"></script>
</html>
