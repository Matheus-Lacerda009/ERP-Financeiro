<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Login: VALENTIM</title>
</head>
<body>
    <main>
        <div class="container">
            <img src="imagens/logo.png" id="logo">
            <div id="divLogin">
            <h2 id="login">Login</h2>
                <form id="formLogin">
                    <input type="text" placeholder="Nome:" id="inputNome">
                    <br>
                    <input type="password" placeholder="Senha:" id="inputSenha">
                    <br>
                    <button type="submit" id="botaoEnvio">Login</button>
                    <br>
                    <label id="loginErro">Bem Vindo!</label>
                </form>
            </div>
        </div>
    </main>
</body>
<script src="index.js"></script>
</html>
